events {
    worker_connections 1024;
}

http {
    client_max_body_size 20M;
    server {
        listen 80;
        server_name localhost;

        # Set root directory for static files
        root /usr/share/nginx/html;

        # Main location block for HTML and frontend routes
        location / {
            # Serve F_page.html for all routes (SPA behavior)
            try_files $uri $uri/ /index.html;
        }
        location /static/ {
            alias /usr/share/nginx/html/static/;
        }

        # API proxy to backend
        location /api/ {
            # Add trailing slash to proxy_pass to preserve URI
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        # Uploads proxy to backend
        location /uploads/ {
            # Add trailing slash to proxy_pass to preserve URI
            proxy_pass http://backend:8000/api/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}