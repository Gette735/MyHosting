
services:
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    volumes:
      - uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      mynet:
        aliases:
          - backend

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    volumes:
      - uploads:/usr/share/nginx/html/uploads
    networks:
      mynet:
        aliases:
          - frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
    mynet:
      driver: bridge
volumes:
  uploads: